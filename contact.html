    $(document).ready(function () {
      var owl = $('.owl-carousel').owlCarousel({
        loop: true,
        margin: 20,
        center: true, // Center the active item
        items: 5, // Display 5 items
        autoplay: false,
        autoplayTimeout: 3000,
        responsive: {
          0: {
            items: 2
          },
          600: {
            items: 3
          },
          1000: {
            items: 4
          }
        }
      });

      // Custom Navigation
      $('.custom-owl-prev').click(function () {
        owl.trigger('prev.owl.carousel');
      });

      $('.custom-owl-next').click(function () {
        owl.trigger('next.owl.carousel');
      });
    });

    // Function to update the description area
    function updateDescription(title, para) {
      $('#activeTitle').text(title);
      $('#activePara').text(para);
    }

    // Get all the FAQ titles
    // Select all FAQ items
    const faqItems = document.querySelectorAll('.faq-title');
    const activeTitle = document.getElementById('activeTitle');
    const activePara = document.getElementById('activePara');

    // Add click event listener to each FAQ item
    faqItems.forEach(item => {
      item.addEventListener('click', function () {
        // Remove 'active' class from all FAQ items
        faqItems.forEach(faq => faq.classList.remove('active'));

        // Add 'active' class to the clicked FAQ item
        this.classList.add('active');

        // Update the title and paragraph in the description container
        const title = this.getAttribute('data-title');
        const para = this.getAttribute('data-para');
        activeTitle.innerText = title;
        activePara.innerText = para;
      });
    });

    // Automatically set the first FAQ as active on page load
    faqItems[0].classList.add('active');
    activeTitle.innerText = faqItems[0].getAttribute('data-title');
    activePara.innerText = faqItems[0].getAttribute('data-para');


    // Get the current year
    const year = new Date().getFullYear();

    // Set the year inside the span with id "currentYear"
    document.getElementById('currentYear').textContent = year;

    // Show or hide the button based on scroll position
    window.onscroll = function () {
      scrollFunction();
      stickyHeader();
    };

    function scrollFunction() {
      const backToTopBtn = document.getElementById("backToTopBtn");
      if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
        backToTopBtn.style.display = "block"; // Show button after scrolling down
      } else {
        backToTopBtn.style.display = "none"; // Hide button at the top
      }
    }

    // Scroll to the top of the page when the button is clicked
    document.getElementById("backToTopBtn").addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: 'smooth' }); // Smooth scroll to top
    });

    // Sticky Header
    var header = document.querySelector(".header");
    var stickyOffset = 300; // Set the offset to 300px

    function stickyHeader() {
      if (window.pageYOffset > stickyOffset) {
        header.classList.add("sticky"); // Add sticky class
      } else {
        header.classList.remove("sticky"); // Remove sticky class
      }
    }

    // Close dropdown when clicking outside
    document.addEventListener("click", function (event) {
      const isDropdown = event.target.matches('.dropdown-toggle');
      const dropdown = document.querySelector('.dropdown-menu.show');

      if (!isDropdown && dropdown) {
        dropdown.classList.remove('show');
      }
    });

    // Handle icon toggling on accordion click
    var accordionButtons = document.querySelectorAll('.accordion-button');

    accordionButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        var icon = this.querySelector('i');

        // Get all icons and reset them to plus
        document.querySelectorAll('.accordion-button i').forEach(function (i) {
          i.classList.remove('fa-minus');
          i.classList.add('fa-plus');
        });

        // If the clicked button is collapsing, set it to minus
        if (!this.classList.contains('collapsed')) {
          icon.classList.remove('fa-plus');
          icon.classList.add('fa-minus');
        }
      });
    });

    $(document).ready(function () {
      var items = $('.custom-item'); // Get all the custom items
      var totalItems = items.length;
      var currentIndex = 0; // Start from the first item
      var autoSlideInterval; // To store the interval

      // Generate nav dots dynamically
      var navDotsContainer = $('.custom-nav-dots');
      for (var i = 0; i < totalItems; i++) {
        navDotsContainer.append('<span class="dot" data-index="' + i + '"></span>');
      }

      // Function to update the carousel and corresponding image
      function updateCarousel(index) {
        currentIndex = index;

        // Remove 'active' class from all items and dots
        items.removeClass('active');
        $('.dot').removeClass('active');

        // Add 'active' class to the current item and dot
        items.eq(currentIndex).addClass('active');
        $('.dot').eq(currentIndex).addClass('active');

        // Get the image filename from the current item's data attribute
        var imageFile = items.eq(currentIndex).data('img');

        // Update the image on the right
        $('#dynamic-image').attr('src', 'images/' + imageFile);
      }

      // Auto slide function
      function startAutoSlide() {
        autoSlideInterval = setInterval(function () {
          currentIndex = (currentIndex + 1) % totalItems; // Increment index and loop back to start
          updateCarousel(currentIndex);
        }, 3000); // Change every 3 seconds
      }

      // Start auto sliding
      startAutoSlide();

      // Click event for nav dots to manually control the slider
      $('.dot').on('click', function () {
        clearInterval(autoSlideInterval); // Stop auto sliding when dot is clicked
        var index = $(this).data('index'); // Get the clicked dot index
        updateCarousel(index); // Update carousel with the selected index
        startAutoSlide(); // Restart the auto slide after user interaction
      });

      // Click event for left-side items
      $('.custom-item').on('click', function () {
        clearInterval(autoSlideInterval); // Stop auto sliding when an item is clicked
        var index = $(this).index(); // Get the index of the clicked item
        updateCarousel(index); // Update carousel with the selected index
        startAutoSlide(); // Restart auto slide after user interaction
      });

      // Initialize the first item and dot as active
      updateCarousel(currentIndex);
    });

    document.addEventListener("DOMContentLoaded", function () {
      const serviceBoxes = document.querySelectorAll('.service-box');

      serviceBoxes.forEach(box => {
        box.addEventListener('click', function (event) {
          // Remove 'service-box-active' class from all service boxes
          serviceBoxes.forEach(box => box.classList.remove('service-box-active'));

          // Add 'service-box-active' class to the clicked box
          this.classList.add('service-box-active');
        });
      });
    });

    document.addEventListener("DOMContentLoaded", function () {
      const learnMoreButtons = document.querySelectorAll(".learn-more-btn");

      learnMoreButtons.forEach(button => {
        button.addEventListener("click", function (event) {
          const targetClass = this.getAttribute("data-target");
          const extraContent = document.querySelector(targetClass);

          if (extraContent) {
            // Toggle visibility of the extra content
            const isVisible = extraContent.style.display === "block";
            extraContent.style.display = isVisible ? "none" : "block";

            // Change button text based on visibility
            this.textContent = isVisible ? "Learn More" : "Less More";
          }
        });
      });
    });
  </script>
