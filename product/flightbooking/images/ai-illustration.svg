<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="500" height="500" rx="30" fill="url(#bg2)"/>
  
  <!-- Circuit/network lines -->
  <line x1="250" y1="250" x2="100" y2="100" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="250" x2="400" y2="100" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="250" x2="80" y2="320" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="250" x2="420" y2="320" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="250" x2="250" y2="80" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="250" x2="170" y2="420" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="250" x2="340" y2="420" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  
  <!-- Center AI brain circle -->
  <circle cx="250" cy="250" r="70" fill="#0EA5E9" opacity="0.15"/>
  <circle cx="250" cy="250" r="50" fill="#0EA5E9" opacity="0.2"/>
  <circle cx="250" cy="250" r="35" fill="#0EA5E9" opacity="0.8"/>
  <text x="250" y="258" font-family="Arial" font-size="24" fill="white" text-anchor="middle" font-weight="bold">AI</text>
  
  <!-- Node circles with icons -->
  <circle cx="100" cy="100" r="35" fill="#1E3A5F"/>
  <circle cx="100" cy="100" r="35" stroke="#0EA5E9" stroke-width="1.5" fill="none"/>
  <text x="100" y="105" font-family="Arial" font-size="20" text-anchor="middle">🤖</text>
  <text x="100" y="148" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Smart</text>
  <text x="100" y="160" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Booking</text>
  
  <circle cx="400" cy="100" r="35" fill="#1E3A5F"/>
  <circle cx="400" cy="100" r="35" stroke="#0EA5E9" stroke-width="1.5" fill="none"/>
  <text x="400" y="105" font-family="Arial" font-size="20" text-anchor="middle">📊</text>
  <text x="400" y="148" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Price</text>
  <text x="400" y="160" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Analytics</text>
  
  <circle cx="80" cy="320" r="35" fill="#1E3A5F"/>
  <circle cx="80" cy="320" r="35" stroke="#0EA5E9" stroke-width="1.5" fill="none"/>
  <text x="80" y="325" font-family="Arial" font-size="20" text-anchor="middle">🗺️</text>
  <text x="80" y="368" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Route</text>
  <text x="80" y="380" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Optimizer</text>
  
  <circle cx="420" cy="320" r="35" fill="#1E3A5F"/>
  <circle cx="420" cy="320" r="35" stroke="#0EA5E9" stroke-width="1.5" fill="none"/>
  <text x="420" y="325" font-family="Arial" font-size="20" text-anchor="middle">💬</text>
  <text x="420" y="368" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">AI</text>
  <text x="420" y="380" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Chatbot</text>
  
  <circle cx="250" cy="80" r="35" fill="#1E3A5F"/>
  <circle cx="250" cy="80" r="35" stroke="#FCD34D" stroke-width="1.5" fill="none"/>
  <text x="250" y="85" font-family="Arial" font-size="20" text-anchor="middle">✈</text>
  <text x="250" y="130" font-family="Arial" font-size="9" fill="#FCD34D" text-anchor="middle">Real-time</text>
  <text x="250" y="142" font-family="Arial" font-size="9" fill="#FCD34D" text-anchor="middle">Tracking</text>
  
  <circle cx="170" cy="420" r="35" fill="#1E3A5F"/>
  <circle cx="170" cy="420" r="35" stroke="#0EA5E9" stroke-width="1.5" fill="none"/>
  <text x="170" y="425" font-family="Arial" font-size="20" text-anchor="middle">🔔</text>
  <text x="170" y="468" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Fare</text>
  <text x="170" y="480" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Alerts</text>
  
  <circle cx="340" cy="420" r="35" fill="#1E3A5F"/>
  <circle cx="340" cy="420" r="35" stroke="#0EA5E9" stroke-width="1.5" fill="none"/>
  <text x="340" y="425" font-family="Arial" font-size="20" text-anchor="middle">🔒</text>
  <text x="340" y="468" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Secure</text>
  <text x="340" y="480" font-family="Arial" font-size="9" fill="#BAE6FD" text-anchor="middle">Payments</text>
  
  <!-- Pulsing rings -->
  <circle cx="250" cy="250" r="90" fill="none" stroke="#0EA5E9" stroke-width="0.5" opacity="0.4" stroke-dasharray="8,4"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="#0EA5E9" stroke-width="0.5" opacity="0.2" stroke-dasharray="6,6"/>
</svg>
