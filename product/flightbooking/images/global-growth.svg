<svg viewBox="0 0 500 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
    <filter id="gSh">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#0369A1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer glow ring -->
  <circle cx="250" cy="220" r="170" fill="#EFF6FF" opacity="0.8"/>
  
  <!-- Globe -->
  <circle cx="250" cy="220" r="140" fill="url(#globeGrad)" filter="url(#gSh)"/>
  
  <!-- Longitude/latitude lines -->
  <ellipse cx="250" cy="220" rx="140" ry="45" fill="none" stroke="white" stroke-width="0.8" opacity="0.2"/>
  <ellipse cx="250" cy="220" rx="140" ry="90" fill="none" stroke="white" stroke-width="0.8" opacity="0.15"/>
  <ellipse cx="250" cy="220" rx="100" ry="140" fill="none" stroke="white" stroke-width="0.8" opacity="0.15"/>
  <ellipse cx="250" cy="220" rx="45" ry="140" fill="none" stroke="white" stroke-width="0.8" opacity="0.2"/>
  <line x1="110" y1="220" x2="390" y2="220" stroke="white" stroke-width="0.8" opacity="0.15"/>
  <line x1="250" y1="80" x2="250" y2="360" stroke="white" stroke-width="0.8" opacity="0.15"/>
  
  <!-- Continents (simplified) -->
  <!-- North America -->
  <path d="M 155 175 L 170 165 L 195 168 L 200 185 L 190 200 L 170 205 L 155 195 Z" fill="white" opacity="0.3"/>
  <!-- Europe/Africa -->
  <path d="M 235 150 L 255 148 L 265 160 L 262 185 L 250 195 L 238 180 L 232 165 Z" fill="white" opacity="0.3"/>
  <path d="M 240 200 L 258 198 L 265 220 L 255 245 L 240 248 L 232 230 L 232 210 Z" fill="white" opacity="0.3"/>
  <!-- Asia -->
  <path d="M 275 155 L 325 150 L 335 165 L 325 180 L 305 185 L 285 178 L 272 168 Z" fill="white" opacity="0.3"/>
  <!-- Australia -->
  <path d="M 310 240 L 340 238 L 348 255 L 338 268 L 315 265 L 308 252 Z" fill="white" opacity="0.25"/>
  
  <!-- Flight route dots and lines -->
  <circle cx="175" cy="185" r="5" fill="#FCD34D"/>
  <circle cx="250" cy="165" r="5" fill="#FCD34D"/>
  <circle cx="305" cy="168" r="5" fill="#FCD34D"/>
  <circle cx="175" cy="255" r="4" fill="#FCD34D" opacity="0.8"/>
  <circle cx="325" cy="252" r="4" fill="#FCD34D" opacity="0.8"/>
  
  <!-- Animated flight arcs -->
  <path d="M 175 185 Q 212 148 250 165" fill="none" stroke="#FCD34D" stroke-width="2" stroke-dasharray="5,3" opacity="0.9"/>
  <path d="M 250 165 Q 277 156 305 168" fill="none" stroke="#FCD34D" stroke-width="2" stroke-dasharray="5,3" opacity="0.9"/>
  <path d="M 175 185 Q 190 230 175 255" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M 305 168 Q 315 210 325 252" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  
  <!-- Planes on routes -->
  <text x="212" y="155" font-family="Arial" font-size="12" transform="rotate(-20 212 155)">✈</text>
  <text x="277" y="158" font-family="Arial" font-size="12" transform="rotate(10 277 158)">✈</text>
  
  <!-- Rising arrow/growth indicator -->
  <g transform="translate(360, 100)">
    <rect width="110" height="90" rx="16" fill="white" opacity="0.95"/>
    <rect width="110" height="90" rx="16" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="55" y="22" font-family="Arial" font-size="8" fill="#64748B" font-weight="600" text-anchor="middle">Global Reach</text>
    <!-- Mini chart bars -->
    <rect x="12" y="58" width="12" height="20" rx="3" fill="#CBD5E1"/>
    <rect x="30" y="48" width="12" height="30" rx="3" fill="#93C5FD"/>
    <rect x="48" y="38" width="12" height="40" rx="3" fill="#60A5FA"/>
    <rect x="66" y="28" width="12" height="50" rx="3" fill="#0EA5E9"/>
    <rect x="84" y="18" width="12" height="60" rx="3" fill="#0369A1"/>
    <!-- Growth arrow -->
    <polyline points="12,62 30,52 48,42 66,32 84,22" fill="none" stroke="#FCD34D" stroke-width="2"/>
    <circle cx="84" cy="22" r="3" fill="#FCD34D"/>
  </g>
  
  <!-- Stats floating cards -->
  <g transform="translate(10, 130)">
    <rect width="105" height="70" rx="14" fill="white" opacity="0.95"/>
    <rect width="105" height="70" rx="14" fill="none" stroke="#0EA5E9" stroke-width="1"/>
    <text x="52" y="22" font-family="Arial" font-size="7" fill="#64748B" text-anchor="middle">Bookings Today</text>
    <text x="52" y="44" font-family="Arial" font-size="22" fill="#0369A1" font-weight="bold" text-anchor="middle">1.2K</text>
    <text x="52" y="60" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle">▲ 34% growth</text>
  </g>
  
  <!-- Bottom label -->
  <rect x="150" y="380" width="200" height="40" rx="20" fill="#0369A1"/>
  <text x="250" y="405" font-family="Arial" font-size="12" fill="white" font-weight="bold" text-anchor="middle">✈  Powering Global Travel</text>
</svg>
