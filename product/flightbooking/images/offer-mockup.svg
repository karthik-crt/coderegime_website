<svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="pshadow">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0369A1" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Phone 1 - Customer App (left, slightly back) -->
  <g filter="url(#pshadow)" opacity="0.85" transform="translate(20, 30) rotate(-8, 105, 240)">
    <rect x="40" y="60" width="130" height="260" rx="20" fill="url(#p1)"/>
    <rect x="47" y="73" width="116" height="234" rx="14" fill="#0F172A"/>
    <!-- Content -->
    <rect x="47" y="73" width="116" height="50" rx="14" fill="#0369A1"/>
    <text x="105" y="95" font-family="Arial" font-size="8" fill="white" font-weight="bold" text-anchor="middle">Customer App</text>
    <text x="105" y="108" font-family="Arial" font-size="7" fill="#BAE6FD" text-anchor="middle">Search & Book</text>
    <rect x="55" y="130" width="100" height="20" rx="10" fill="#1E3A5F"/>
    <text x="80" y="144" font-family="Arial" font-size="8" fill="#94A3B8">From ✈</text>
    <rect x="55" y="158" width="100" height="20" rx="10" fill="#1E3A5F"/>
    <text x="80" y="172" font-family="Arial" font-size="8" fill="#94A3B8">To  ✈</text>
    <!-- Flight results -->
    <rect x="55" y="188" width="100" height="32" rx="8" fill="#1E293B"/>
    <text x="65" y="201" font-family="Arial" font-size="7" fill="white" font-weight="bold">DEL → DXB</text>
    <text x="65" y="213" font-family="Arial" font-size="6" fill="#64748B">₹8,499 • 4h30m</text>
    <rect x="55" y="228" width="100" height="32" rx="8" fill="#1E293B"/>
    <text x="65" y="241" font-family="Arial" font-size="7" fill="white" font-weight="bold">MUM → SIN</text>
    <text x="65" y="253" font-family="Arial" font-size="6" fill="#64748B">₹12,200 • 6h15m</text>
    <rect x="65" y="268" width="80" height="22" rx="11" fill="#0EA5E9"/>
    <text x="105" y="283" font-family="Arial" font-size="8" fill="white" font-weight="bold" text-anchor="middle">Book Now</text>
  </g>
  
  <!-- Phone 2 - Admin Panel (center, front) -->
  <g filter="url(#pshadow)" transform="translate(155, 10)">
    <rect x="40" y="40" width="160" height="310" rx="24" fill="url(#p2)"/>
    <rect x="48" y="55" width="144" height="280" rx="16" fill="#0F172A"/>
    <!-- Header -->
    <rect x="48" y="55" width="144" height="55" rx="16" fill="#0369A1"/>
    <text x="120" y="77" font-family="Arial" font-size="9" fill="white" font-weight="bold" text-anchor="middle">Admin Dashboard</text>
    <!-- Stats row -->
    <rect x="56" y="120" width="60" height="45" rx="10" fill="#1E293B"/>
    <text x="86" y="140" font-family="Arial" font-size="12" fill="#0EA5E9" font-weight="bold" text-anchor="middle">247</text>
    <text x="86" y="155" font-family="Arial" font-size="7" fill="#94A3B8" text-anchor="middle">Bookings</text>
    <rect x="124" y="120" width="60" height="45" rx="10" fill="#1E293B"/>
    <text x="154" y="140" font-family="Arial" font-size="10" fill="#10B981" font-weight="bold" text-anchor="middle">₹2.1L</text>
    <text x="154" y="155" font-family="Arial" font-size="7" fill="#94A3B8" text-anchor="middle">Revenue</text>
    <!-- Chart bars -->
    <rect x="56" y="175" width="128" height="65" rx="10" fill="#1E293B"/>
    <text x="70" y="188" font-family="Arial" font-size="7" fill="#94A3B8">Weekly Revenue</text>
    <rect x="65" y="212" width="10" height="20" rx="3" fill="#0EA5E9" opacity="0.5"/>
    <rect x="80" y="205" width="10" height="27" rx="3" fill="#0EA5E9" opacity="0.7"/>
    <rect x="95" y="200" width="10" height="32" rx="3" fill="#0EA5E9"/>
    <rect x="110" y="208" width="10" height="24" rx="3" fill="#0EA5E9" opacity="0.6"/>
    <rect x="125" y="196" width="10" height="36" rx="3" fill="#FCD34D"/>
    <rect x="140" y="204" width="10" height="28" rx="3" fill="#0EA5E9" opacity="0.7"/>
    <!-- Active flights -->
    <rect x="56" y="250" width="128" height="22" rx="8" fill="#1E293B"/>
    <text x="66" y="264" font-family="Arial" font-size="7" fill="white">✈ AI-9801 • On Time</text>
    <circle cx="175" cy="261" r="5" fill="#10B981"/>
    <rect x="56" y="280" width="128" height="22" rx="8" fill="#1E293B"/>
    <text x="66" y="294" font-family="Arial" font-size="7" fill="white">✈ 6E-2214 • Delayed</text>
    <circle cx="175" cy="291" r="5" fill="#F59E0B"/>
    <rect x="56" y="310" width="128" height="22" rx="8" fill="#1E293B"/>
    <text x="66" y="324" font-family="Arial" font-size="7" fill="white">✈ SG-0112 • On Time</text>
    <circle cx="175" cy="321" r="5" fill="#10B981"/>
  </g>
  
  <!-- Phone 3 - Airline/Driver App (right, slightly back) -->
  <g filter="url(#pshadow)" opacity="0.85" transform="translate(330, 30) rotate(8, 105, 240)">
    <rect x="40" y="60" width="130" height="260" rx="20" fill="url(#p3)"/>
    <rect x="47" y="73" width="116" height="234" rx="14" fill="#0F172A"/>
    <!-- Header -->
    <rect x="47" y="73" width="116" height="50" rx="14" fill="#1E3A5F"/>
    <text x="105" y="95" font-family="Arial" font-size="8" fill="white" font-weight="bold" text-anchor="middle">Airline Portal</text>
    <text x="105" y="108" font-family="Arial" font-size="7" fill="#BAE6FD" text-anchor="middle">Manage Flights</text>
    <!-- Schedule -->
    <text x="58" y="140" font-family="Arial" font-size="7" fill="#64748B">Today's Schedule</text>
    <rect x="55" y="148" width="100" height="28" rx="8" fill="#1E293B"/>
    <text x="62" y="162" font-family="Arial" font-size="7" fill="white" font-weight="bold">DEL→BOM 08:00</text>
    <text x="62" y="173" font-family="Arial" font-size="6" fill="#10B981">✓ 156/180 seats</text>
    <rect x="55" y="182" width="100" height="28" rx="8" fill="#1E293B"/>
    <text x="62" y="196" font-family="Arial" font-size="7" fill="white" font-weight="bold">BLR→DEL 12:30</text>
    <text x="62" y="207" font-family="Arial" font-size="6" fill="#F59E0B">⚡ 98/180 seats</text>
    <rect x="55" y="216" width="100" height="28" rx="8" fill="#1E293B"/>
    <text x="62" y="230" font-family="Arial" font-size="7" fill="white" font-weight="bold">MUM→CCU 16:45</text>
    <text x="62" y="241" font-family="Arial" font-size="6" fill="#10B981">✓ 174/180 seats</text>
    <!-- Revenue -->
    <rect x="55" y="255" width="100" height="40" rx="8" fill="#0369A1" opacity="0.3"/>
    <text x="105" y="271" font-family="Arial" font-size="8" fill="#BAE6FD" text-anchor="middle">Today's Revenue</text>
    <text x="105" y="287" font-family="Arial" font-size="12" fill="white" font-weight="bold" text-anchor="middle">₹4.8L</text>
  </g>
</svg>
