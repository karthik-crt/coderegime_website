<svg viewBox="0 0 420 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Background glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#0EA5E9" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Glow background -->
  <ellipse cx="210" cy="350" rx="180" ry="120" fill="url(#glow)"/>
  
  <!-- Main Phone -->
  <g filter="url(#shadow)">
    <rect x="80" y="40" width="200" height="400" rx="28" ry="28" fill="url(#phoneGrad)"/>
    <!-- Screen -->
    <rect x="88" y="55" width="184" height="370" rx="22" ry="22" fill="url(#screenGrad)"/>
    <!-- Notch -->
    <rect x="148" y="55" width="64" height="14" rx="7" fill="#0F172A"/>
    
    <!-- App Header -->
    <rect x="88" y="55" width="184" height="70" rx="22" fill="#0369A1"/>
    <rect x="88" y="95" width="184" height="30" fill="#0369A1"/>
    <text x="180" y="82" font-family="Arial" font-size="11" fill="white" font-weight="bold" text-anchor="middle">✈ FlightRegime</text>
    <text x="180" y="98" font-family="Arial" font-size="8" fill="#BAE6FD" text-anchor="middle">Where do you want to fly?</text>
    
    <!-- Search bar -->
    <rect x="100" y="110" width="160" height="28" rx="14" fill="white" opacity="0.95"/>
    <text x="120" y="128" font-family="Arial" font-size="8" fill="#64748B">🔍  Search flights...</text>
    
    <!-- Flight cards -->
    <!-- Card 1 -->
    <rect x="100" y="148" width="160" height="60" rx="12" fill="url(#cardGrad)"/>
    <text x="112" y="165" font-family="Arial" font-size="9" fill="#0F172A" font-weight="bold">DEL → DXB</text>
    <text x="112" y="178" font-family="Arial" font-size="7" fill="#64748B">Air India • 4h 30m</text>
    <text x="200" y="165" font-family="Arial" font-size="9" fill="#0369A1" font-weight="bold" text-anchor="end">₹8,499</text>
    <line x1="112" y1="182" x2="248" y2="182" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Progress dots -->
    <circle cx="130" cy="192" r="3" fill="#0369A1"/>
    <line x1="133" y1="192" x2="215" y2="192" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,2"/>
    <circle cx="218" cy="192" r="3" fill="#0369A1"/>
    <text x="128" y="203" font-family="Arial" font-size="6" fill="#64748B">06:30</text>
    <text x="210" y="203" font-family="Arial" font-size="6" fill="#64748B">11:00</text>
    
    <!-- Card 2 -->
    <rect x="100" y="218" width="160" height="60" rx="12" fill="url(#cardGrad)"/>
    <text x="112" y="235" font-family="Arial" font-size="9" fill="#0F172A" font-weight="bold">MUM → SIN</text>
    <text x="112" y="248" font-family="Arial" font-size="7" fill="#64748B">IndiGo • 6h 15m</text>
    <text x="200" y="235" font-family="Arial" font-size="9" fill="#0369A1" font-weight="bold" text-anchor="end">₹12,200</text>
    <line x1="112" y1="252" x2="248" y2="252" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="130" cy="262" r="3" fill="#F59E0B"/>
    <line x1="133" y1="262" x2="215" y2="262" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,2"/>
    <circle cx="218" cy="262" r="3" fill="#F59E0B"/>
    <text x="128" y="273" font-family="Arial" font-size="6" fill="#64748B">09:15</text>
    <text x="210" y="273" font-family="Arial" font-size="6" fill="#64748B">15:30</text>
    
    <!-- Booking confirmed card -->
    <rect x="100" y="288" width="160" height="50" rx="12" fill="#0F172A"/>
    <text x="116" y="308" font-family="Arial" font-size="8" fill="#10B981" font-weight="bold">✓ Booking Confirmed!</text>
    <text x="116" y="322" font-family="Arial" font-size="7" fill="#94A3B8">PNR: AB1234 • Seat 14A</text>
    <rect x="200" y="297" width="50" height="22" rx="8" fill="#0EA5E9"/>
    <text x="225" y="312" font-family="Arial" font-size="7" fill="white" font-weight="bold" text-anchor="middle">E-Ticket</text>
    
    <!-- Bottom nav -->
    <rect x="88" y="390" width="184" height="35" rx="0" fill="#0F172A"/>
    <rect x="88" y="390" width="184" height="35" rx="0" fill="#0F172A" opacity="0.9"/>
    <text x="118" y="412" font-family="Arial" font-size="12" text-anchor="middle">🏠</text>
    <text x="158" y="412" font-family="Arial" font-size="12" text-anchor="middle">✈</text>
    <text x="200" y="412" font-family="Arial" font-size="12" text-anchor="middle">🧳</text>
    <text x="242" y="412" font-family="Arial" font-size="12" text-anchor="middle">👤</text>
  </g>
  
  <!-- Floating badge - Price Alert -->
  <g filter="url(#shadow2)" transform="translate(240, 120)">
    <rect x="0" y="0" width="120" height="55" rx="14" fill="white"/>
    <rect x="0" y="0" width="120" height="55" rx="14" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="18" font-family="Arial" font-size="9" fill="#64748B">Price Alert 🔔</text>
    <text x="12" y="34" font-family="Arial" font-size="14" fill="#0369A1" font-weight="bold">₹5,299</text>
    <text x="12" y="47" font-family="Arial" font-size="7" fill="#10B981">▼ 23% drop today!</text>
  </g>
  
  <!-- Floating badge - Rating -->
  <g filter="url(#shadow2)" transform="translate(20, 280)">
    <rect x="0" y="0" width="110" height="55" rx="14" fill="white"/>
    <rect x="0" y="0" width="110" height="55" rx="14" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <text x="10" y="18" font-family="Arial" font-size="8" fill="#64748B">⭐ User Rating</text>
    <text x="10" y="34" font-family="Arial" font-size="16" fill="#F59E0B" font-weight="bold">4.9</text>
    <text x="48" y="34" font-family="Arial" font-size="8" fill="#64748B">/5.0</text>
    <text x="10" y="47" font-family="Arial" font-size="7" fill="#64748B">12K+ reviews</text>
  </g>
  
  <!-- Floating badge - routes -->
  <g filter="url(#shadow2)" transform="translate(255, 360)">
    <rect x="0" y="0" width="120" height="55" rx="14" fill="#0369A1"/>
    <text x="10" y="18" font-family="Arial" font-size="8" fill="#BAE6FD">Live Routes</text>
    <text x="10" y="36" font-family="Arial" font-size="15" fill="white" font-weight="bold">500+</text>
    <text x="10" y="49" font-family="Arial" font-size="7" fill="#BAE6FD">Destinations worldwide</text>
  </g>
</svg>
